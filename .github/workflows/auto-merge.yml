name: Auto Merge PR

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make auto-merge script executable
        run: chmod +x scripts/auto-merge.sh

      - name: Merge PRs with all checks passing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/auto-merge.sh
