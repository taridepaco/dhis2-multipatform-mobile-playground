name: Auto Merge PR

on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PRs with all checks passing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoData.default_branch;

            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: defaultBranch,
            });

            for (const pr of prs) {
              if (pr.draft) continue;

              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha,
              });

              const runs = checks.check_runs;
              if (runs.length === 0) continue;
              if (runs.some(r => r.status !== 'completed' || r.conclusion !== 'success')) continue;

              const { data: fullPr } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });
              if (!fullPr.mergeable) continue;

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, merge_method: 'squash',
                });
                if (fullPr.head.repo && !fullPr.head.repo.fork) {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${pr.head.ref}`,
                  });
                }
                console.log(`Merged PR #${pr.number} and deleted branch ${pr.head.ref}`);
              } catch (e) {
                console.log(`Could not merge PR #${pr.number}: ${e.message}`);
              }
            }
